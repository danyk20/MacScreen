version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: site
    # @astrojs/check declares a peer of typescript ^5 || ^6; revisit when it supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      site-dependencies:
        patterns: ['*']
