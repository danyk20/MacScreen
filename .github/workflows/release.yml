name: Release

# Push a semantic-version tag (v1.2.3, v1.2.3-beta.1) to build and publish a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:   # dry run: builds and uploads artifacts, publishes nothing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # test and build run in parallel; publish waits for both.
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache SwiftPM build (debug)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: Scripts/test.sh

  build:
    name: Build and package (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dryrun"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp version into Info.plist
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # CFBundleShortVersionString must be numeric (x.y.z); a pre-release suffix stays in the tag and file names.
          SHORT="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist
          # The in-app updater compares this full version (pre-release suffix included).
          /usr/libexec/PlistBuddy -c "Set :MSReleaseVersion ${VERSION}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MSReleaseVersion" Resources/Info.plist

      - name: Cache SwiftPM build (release, universal)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Build app (universal, ad-hoc signed)
        run: Scripts/make-app.sh

      - name: Build audio driver
        run: Scripts/build-audio-driver.sh

      - name: Package
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist stage/audio/build stage/audio/Scripts
          ditto -c -k --keepParent build/MacScreen.app "dist/MacScreen-${TAG}-macOS.zip"
          cp -R build/MacScreenAudio.driver stage/audio/build/
          cp Scripts/install-audio-driver.sh Scripts/uninstall-audio-driver.sh stage/audio/Scripts/
          (cd stage && zip -qry "../dist/MacScreen-AudioDriver-${TAG}.zip" audio)
          zip -qj "dist/msprobe-${TAG}-macOS.zip" build/msprobe
          Scripts/make-dmg.sh "dist/MacScreen-${TAG}.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 7
          if-no-files-found: error

  # Publishing needs no macOS: a cheap, fast Linux runner handles checksums, attestation and the release.
  publish:
    name: Publish GitHub Release
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Checksums
        run: cd dist && sha256sum ./*.zip ./*.dmg | tee SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cat > notes-header.md <<'N'
          ## Install
          **Homebrew (one command):**
          ```
          brew tap danyk20/macscreen https://github.com/danyk20/MacScreen
          brew install --cask macscreen
          ```
          **Or download:** open `MacScreen-*.dmg` and drag MacScreen to Applications. The app is **not notarized**,
          so the first time right-click it and choose **Open** (or run `xattr -dr com.apple.quarantine /Applications/MacScreen.app`).

          Then run it on both Macs and pair them with the code shown on the Display Mac. Optional (experimental): `MacScreen-AudioDriver-*.zip` adds the sound-on-Display driver; run
             `audio/Scripts/install-audio-driver.sh`.

          Verify downloads with `SHA256SUMS.txt` or `gh attestation verify <file> --repo ${{ github.repository }}`.

          ## Changes
          N
          FLAGS=(--generate-notes --title "MacScreen ${TAG}")
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt "${FLAGS[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes-header.md

      # Keep the Homebrew cask in step with the release (the cask lives in this repository's Casks/ folder).
      - name: Check out main for the cask
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tap

      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          SHA="$(sha256sum "dist/MacScreen-v${VERSION}.dmg" | cut -d' ' -f1)"
          cd tap
          Scripts/render-cask.sh "$VERSION" "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macscreen.rb
          if git diff --cached --quiet; then echo "Cask already up to date"; exit 0; fi
          git commit -m "Cask: macscreen ${VERSION}"
          git push origin HEAD:main
