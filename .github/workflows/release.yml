name: Release

# Push a semantic-version tag (v1.2.3, v1.2.3-beta.1) to build and publish a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:   # dry run: builds and uploads artifacts, publishes nothing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # test and build run in parallel; publish waits for both.
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache SwiftPM build (debug)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: Scripts/test.sh

  build:
    name: Build and package (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dryrun"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp version into Info.plist
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # CFBundleShortVersionString must be numeric (x.y.z); a pre-release suffix stays in the tag and file names.
          SHORT="${VERSION%%-*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist

      - name: Cache SwiftPM build (release, universal)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Build app (universal, ad-hoc signed)
        run: Scripts/make-app.sh

      - name: Build audio driver
        run: Scripts/build-audio-driver.sh

      - name: Package
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist stage/audio/build stage/audio/Scripts
          ditto -c -k --keepParent build/MacScreen.app "dist/MacScreen-${TAG}-macOS.zip"
          cp -R build/MacScreenAudio.driver stage/audio/build/
          cp Scripts/install-audio-driver.sh Scripts/uninstall-audio-driver.sh stage/audio/Scripts/
          (cd stage && zip -qry "../dist/MacScreen-AudioDriver-${TAG}.zip" audio)
          zip -qj "dist/msprobe-${TAG}-macOS.zip" build/msprobe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error

  # Publishing needs no macOS: a cheap, fast Linux runner handles checksums, attestation and the release.
  publish:
    name: Publish GitHub Release
    needs: [test, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Checksums
        run: cd dist && sha256sum ./*.zip | tee SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          cat > notes-header.md <<'N'
          ## Install
          1. Download `MacScreen-*-macOS.zip`, unzip, move `MacScreen.app` to `/Applications` (or `~/Applications`).
          2. The app is **not notarized**: right-click it, choose **Open** the first time
             (or run `xattr -dr com.apple.quarantine MacScreen.app`).
          3. Run it on both Macs and pair them with the code shown on the Display Mac.
          4. Optional (experimental): `MacScreen-AudioDriver-*.zip` adds the sound-on-Display driver; run
             `audio/Scripts/install-audio-driver.sh`.

          Verify downloads with `SHA256SUMS.txt` or `gh attestation verify <file> --repo ${{ github.repository }}`.

          ## Changes
          N
          FLAGS=(--generate-notes --title "MacScreen ${TAG}")
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt "${FLAGS[@]}" --notes-file notes-header.md
