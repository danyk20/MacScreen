name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build and test
        run: Scripts/test.sh
      - name: Build app and audio driver (universal, ad-hoc signed)
        run: |
          Scripts/make-app.sh
          Scripts/build-audio-driver.sh
