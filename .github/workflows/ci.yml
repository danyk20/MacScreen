name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# A newer push to the same ref cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (Dependabot keeps them current).

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --severity=warning Scripts/*.sh Scripts/icon/*.sh

  # Independent jobs run in parallel, so wall-clock time is the slowest job, not the sum.
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Cache SwiftPM build (debug)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build and test
        run: Scripts/test.sh

  # The universal app is the slow part (two architectures), so pull requests skip it;
  # it runs on main so a broken release build is caught right after merge.
  package:
    name: Package (universal app + audio driver)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache SwiftPM build (release, universal)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Build universal app (ad-hoc signed)
        run: Scripts/make-app.sh
      - name: Build audio driver
        run: Scripts/build-audio-driver.sh
      - name: Verify bundle
        run: |
          lipo -archs build/MacScreen.app/Contents/MacOS/MacScreen
          codesign --verify --deep --strict build/MacScreen.app
          test -f build/MacScreen.app/Contents/Resources/AppIcon.icns
      - name: Upload build for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macscreen-ci-build
          path: build/MacScreen.app
          retention-days: 7
          if-no-files-found: error
