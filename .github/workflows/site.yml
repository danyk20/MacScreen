name: Site quality

# Full quality gates for the website: types, build, HTML validity, accessibility, Lighthouse budgets and links.
# Deployment is a separate workflow (pages.yml), which also runs the cheap gates before publishing.
on:
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, accessibility, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Validate HTML
        run: npm run validate
      - name: Accessibility (axe, light and dark, desktop and mobile)
        run: npm run a11y
      - name: Lighthouse budgets (mobile)
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: site/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore

  links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 20 --scheme https
            --exclude '^https://danyk20\.github\.io/MacScreen/sitemap-index\.xml$'
            'site/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
