name: Request a feature
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like MacScreen to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
